/* Family Board — wall calendar for the living-room TV. Dark, high contrast, readable from the couch.
   Layout: header (clock + kids' cards) over three columns: today + 7 days (2 rows of 4), today's chores, and Today / Reminders / School / Groceries. */
:root{
  --bg:#11152a; --panel:#1a2042; --panel-2:#222a55; --line:#2e3870; --ink:#f3f4ff; --ink-2:#aab1d8; --ink-3:#7c84b3;
  --accent:#ffd43b; --today:#4dabf7;
  --off:#ff8787; --off-bg:#47222b; --early:#ffd166; --early-bg:#3f3518; --late:#b8a6ff; --late-bg:#2e2756; --first:#69db7c; --first-bg:#173b28;
  --g0:#74c0fc; --g1:#ffa8a8; --g2:#8ce99a; --g3:#ffd8a8; --g4:#d0bfff; --g5:#99e9f2;
  --f-display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --r:16px; color-scheme:dark;
}
*{box-sizing:border-box}
html, body, #app{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:clamp(13px, 1vw, 26px); line-height:1.3; padding:clamp(10px, 1vw, 22px) clamp(16px, 1.2vw, 26px); overflow:hidden}
button, input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
[hidden]{display:none!important}

.board{height:100%; display:grid; grid-template-rows:auto minmax(0,1fr); gap:clamp(8px, .9vw, 18px)}
.head{display:flex; align-items:center; gap:clamp(12px, 1.4vw, 30px); min-width:0}
.clock{font-family:var(--f-display); font-weight:800; font-size:clamp(2.2rem, 4vw, 6rem); line-height:.9; letter-spacing:-.01em; font-variant-numeric:tabular-nums}
.date{font-family:var(--f-display); font-weight:700; font-size:clamp(1.1rem, 1.7vw, 2.6rem); line-height:1}
.date small{display:block; font-family:var(--f-body); font-weight:700; font-size:.5em; color:var(--ink-2); letter-spacing:.04em; margin-top:.25em}
.kids{display:flex; gap:clamp(8px, .8vw, 16px); margin-left:auto; min-width:0}
.kid{display:grid; grid-template-columns:auto minmax(0,1fr); gap:.2em .7em; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:.45em .9em .45em .5em; min-width:0}
.kid svg{grid-row:1 / 3; width:clamp(40px, 3.2vw, 76px); height:auto}
.kid b{font-family:var(--f-display); font-size:1.25em; line-height:1}
.kid .meta{display:flex; gap:.8em; font-size:.85em; font-weight:700; color:var(--ink-2); white-space:nowrap}
.kid .meta .star{color:var(--accent)} .kid .meta .cash{color:var(--first)}
.bar{height:.45em; border-radius:99px; background:var(--panel-2); overflow:hidden; margin-top:.15em}
.bar i{display:block; height:100%; background:var(--k, var(--today)); border-radius:99px}
.kid.done .bar i{background:var(--first)}

.body{display:grid; grid-template-rows:minmax(0,1fr); grid-template-columns:minmax(0,1fr) clamp(170px, 14.5vw, 420px) clamp(200px, 17.5vw, 480px); gap:clamp(10px, 1vw, 20px); min-height:0}
.weeks{display:grid; grid-template-rows:auto minmax(0,1fr); gap:.35em; min-height:0}
.week{display:grid; grid-template-rows:auto minmax(0,1fr); gap:.35em; min-height:0}
.wlabel{font-size:.78em; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.wlabel b{color:var(--ink-2)}
.grid{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); grid-template-rows:repeat(2, minmax(0,1fr)); gap:clamp(4px, .45vw, 10px); min-height:0}
.day{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:clamp(6px, .55vw, 12px); display:flex; flex-direction:column; gap:.3em; min-width:0; min-height:0; overflow:hidden; font-size:1.22em}
.day .list{gap:.45em}
.day.past{opacity:.45}
.day.today{border:3px solid var(--today); background:var(--panel-2)}
.dh{display:flex; align-items:baseline; justify-content:space-between; gap:.4em}
.dh .d{font-size:.66em; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2)}
.dh .n{font-family:var(--f-display); font-weight:800; font-size:1.4em; line-height:1; font-variant-numeric:tabular-nums}
.day.today .dh .d, .day.today .dh .n{color:var(--today)}
.ban{border-radius:8px; padding:.22em .5em; font-size:.68em; font-weight:800; line-height:1.2; color:var(--c); background:var(--cb)}
.ban span{display:block; color:var(--ink); font-weight:700}
.s-off{--c:var(--off); --cb:var(--off-bg)} .s-early{--c:var(--early); --cb:var(--early-bg)} .s-late{--c:var(--late); --cb:var(--late-bg)} .s-first{--c:var(--first); --cb:var(--first-bg)}
.list{display:flex; flex-direction:column; gap:clamp(4px, .4vw, 8px); min-height:0; flex:1; overflow:hidden}
.ev{display:grid; grid-template-columns:.28em minmax(0,1fr); gap:.45em}
.ev::before{content:""; border-radius:4px; background:var(--c, var(--g0))}
.ev .t{font-size:.72em; font-weight:800; color:var(--c, var(--ink-2)); font-variant-numeric:tabular-nums; margin-right:.35em; white-space:nowrap}
.ev .x{font-weight:800; line-height:1.2; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.ev .m{font-size:.68em; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.day .more, .day .none{font-size:.7em}
.more, .none{font-size:.78em; font-weight:700; color:var(--ink-3)}

.side{display:flex; flex-direction:column; gap:clamp(8px, .9vw, 18px); min-height:0; overflow:hidden}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:clamp(10px, .9vw, 18px); display:flex; flex-direction:column; gap:.55em; min-height:0}
.panel.grow{flex:1; overflow:hidden}
.panel h2{margin:0; font-family:var(--f-display); font-weight:800; font-size:1.3em; line-height:1; display:flex; justify-content:space-between; align-items:baseline; gap:.5em}
.panel h2 small{font-family:var(--f-body); font-size:.6em; font-weight:800; color:var(--ink-3)}
.ag{display:grid; grid-template-columns:4.6em minmax(0,1fr); gap:.6em; padding:.45em .6em; border-radius:10px; background:var(--panel-2); border-left:.3em solid var(--c, var(--g0))}
.ag .t{font-weight:800; color:var(--ink-2); font-size:.85em; font-variant-numeric:tabular-nums}
.ag .x{font-weight:800; line-height:1.25; overflow-wrap:anywhere}
.ag .m{font-size:.8em; color:var(--ink-2)}
.sch{display:grid; grid-template-columns:3.4em minmax(0,1fr); gap:.6em; align-items:start}
.sch .dd{background:var(--cb); color:var(--c); border-radius:8px; text-align:center; padding:.15em 0; font-weight:800; font-size:.8em; line-height:1.05}
.sch .dd b{display:block; font-family:var(--f-display); font-size:1.6em}
.sch .x{font-weight:800; line-height:1.2} .sch .m{font-size:.8em; color:var(--ink-2)}
.gro{display:flex; flex-wrap:wrap; gap:.35em}
.gro button{border:1px solid var(--line); background:var(--panel-2); border-radius:99px; padding:.15em .7em; font-weight:700}
.gro button.got{text-decoration:line-through; color:var(--ink-3); background:transparent}
.gadd{display:flex; gap:.4em}
.gadd input{flex:1; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:.35em .6em}
.btn{border:1px solid var(--line); background:var(--panel-2); border-radius:99px; padding:.35em 1em; font-weight:800}
.btn.primary{background:var(--accent); color:#1b1b1b; border-color:var(--accent)}
/* Slow scroll for busy days and long chore lists */
.list.scrolling{-webkit-mask-image:linear-gradient(transparent, #000 6%, #000 92%, transparent); mask-image:linear-gradient(transparent, #000 6%, #000 92%, transparent)}
.reel{display:flex; flex-direction:column; gap:inherit; animation:reel var(--dur, 40s) linear infinite; will-change:transform}
.reel-gap{height:.6em; flex:none}
@keyframes reel{0%,6%{transform:translateY(0)} 100%{transform:translateY(var(--shift))}}
/* Chores column */
.chores{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:clamp(10px, .9vw, 18px); display:flex; flex-direction:column; gap:.6em; min-height:0; overflow:hidden}
.chores h2{margin:0; font-family:var(--f-display); font-weight:800; font-size:1.3em; line-height:1; display:flex; justify-content:space-between; align-items:baseline; gap:.5em}
.chores h2 small{font-family:var(--f-body); font-size:.6em; font-weight:800; color:var(--ink-3)}
#choreCol{gap:.8em}
.ckid{background:var(--panel-2); border-radius:12px; padding:.55em .65em; display:flex; flex-direction:column; gap:.35em; border-left:.3em solid var(--k)}
.ckid.done{box-shadow:inset 0 0 0 2px var(--first)}
.ckh{display:flex; align-items:center; gap:.5em}
.ckh svg{width:2.2em; height:auto; flex:none}
.ckh b{font-family:var(--f-display); font-size:1.2em; line-height:1; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ckh .ct{font-weight:800; color:var(--k); font-variant-numeric:tabular-nums}
.ckid.done .bar i{background:var(--first)}
